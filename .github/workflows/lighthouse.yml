name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: 'Lighthouse CI config path (例: .lighthouserc.day3.json)'
        required: false
        default: './.lighthouserc.json'
        type: string

jobs:
  lighthouse:
    # 2026-10-09: ubuntu-latest は 2026-10-19 から Ubuntu 26 へ移行する（actions/runner-images#14748）。
    # Node・pnpm・Chrome の版が予告なく変わる事故を避けるため 24.04 に固定（pipeline #62 と同じ）。26.04 で動作確認してから上げる。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ${{ inputs.config || './.lighthouserc.json' }}
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
